# Smoke test for the generate-test-attributes action. It runs on GitHub hosted
# runners only, it does not provision any instance in Azure.
name: Test generate-test-attributes action

on:
  # Pushing a throwaway branch is enough to get the results, no pull request needed
  push:
    branches:
      - 'test/**'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/actions/generate-test-attributes/action.yaml'
      - '.github/workflows/test-generate-test-attributes.yaml'

permissions:
  contents: read

jobs:
  # What the action produces when it is called correctly. The expected values are
  # pinned per runner, an empty attribute is not the only way this can break.
  attributes:
    name: ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux runs podman natively, the provider attribute stays empty there
          - runner: ubuntu-24.04
            provider: ''
            expected-os: ubuntu
            expected-os-version: '24.04'
            expected-platform: linux
            expected-architecture: x86_64
          - runner: windows-2022
            provider: wsl
            expected-os: windows
            expected-os-version: '2022'
            expected-platform: windows-nt
            expected-architecture: x86_64
          # The only runner in the matrix that is not x86_64
          - runner: macos-15
            provider: applehv
            expected-os: macos
            expected-os-version: '15'
            expected-platform: darwin
            expected-architecture: arm64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The runner is the machine under test, everything is detected
      - name: Generate attributes from the runner
        id: detected
        uses: ./.github/actions/generate-test-attributes
        with:
          runs-on-gh-runner: true
          podman-provider: ${{ matrix.provider }}
          podman-version: 6.0.2

      # The tests would run on a VM provisioned in Azure, the runner only drives them.
      # Nothing the runner reports about itself may end up in this file.
      - name: Generate attributes for a provisioned VM
        id: provisioned
        uses: ./.github/actions/generate-test-attributes
        with:
          runs-on-gh-runner: false
          dir: results
          podman-provider: hyperv
          podman-version: 6.0.2
          os: windows
          os-version: '2025'
          architecture: x86_64
          # podman-version collides on purpose, extra-attributes has to win over it
          extra-attributes: '{"podman-release": "6.0.2", "podman-version": "7.0.0-rc1"}'

      # An input still wins over detection when the tests do run on the runner.
      # This is also the only call that exercises the filename and repository inputs.
      - name: Generate attributes with inputs overriding detection
        id: overridden
        uses: ./.github/actions/generate-test-attributes
        with:
          runs-on-gh-runner: true
          filename: custom-attributes.json
          repository: podman-desktop-companion
          podman-version: 6.0.2
          os: fedora
          os-version: '42'
          platform: linux

      - name: Verify the generated attributes
        shell: bash
        env:
          RUNNER_LABEL: ${{ matrix.runner }}
          EXPECTED_PROVIDER: ${{ matrix.provider }}
          EXPECTED_OS: ${{ matrix.expected-os }}
          EXPECTED_OS_VERSION: ${{ matrix.expected-os-version }}
          EXPECTED_PLATFORM: ${{ matrix.expected-platform }}
          EXPECTED_ARCHITECTURE: ${{ matrix.expected-architecture }}
          DETECTED_FILE: ${{ steps.detected.outputs.attributes-file }}
          DETECTED_ATTRIBUTES: ${{ steps.detected.outputs.attributes }}
          PROVISIONED_FILE: ${{ steps.provisioned.outputs.attributes-file }}
          OVERRIDDEN_FILE: ${{ steps.overridden.outputs.attributes-file }}
        run: |
          # Every check runs, the step reports all of the failures at once. Each one
          # also lands in the job summary, that is the single place to look at first.
          set -uo pipefail
          fail=0
          checks=0
          rows=""

          record() { # file key expected actual
            rows="${rows}| \`$1\` | \`$2\` | \`$3\` | \`$4\` |"$'\n'
            echo "::error file=$1::$1: $2 is '$4', expected '$3'"
            fail=1
          }

          check() { # file key expected
            checks=$((checks + 1))
            actual=$(jq -r --arg key "$2" '.[$key] // ""' "$1")
            if [ "${actual}" != "$3" ]; then
              record "$1" "$2" "$3" "${actual}"
            fi
          }

          check_prefix() { # file key expected-prefix
            checks=$((checks + 1))
            actual=$(jq -r --arg key "$2" '.[$key] // ""' "$1")
            case "${actual}" in
              "$3"*) ;;
              *) record "$1" "$2" "$3*" "${actual}" ;;
            esac
          }

          for file in "${DETECTED_FILE}" "${PROVISIONED_FILE}" "${OVERRIDDEN_FILE}"; do
            echo "::group::${file}"
            cat "${file}"
            echo "::endgroup::"
          done

          check_output() { # what expected actual
            checks=$((checks + 1))
            if [ "$3" != "$2" ]; then
              record "attributes-file output" "$1" "$2" "$3"
            fi
          }

          # The action wrote the files where it says it did
          check_output "default name in the workspace root" "workflow-run-attributes.json" "${DETECTED_FILE}"
          check_output "dir input"                          "results/workflow-run-attributes.json" "${PROVISIONED_FILE}"
          check_output "filename input"                     "custom-attributes.json" "${OVERRIDDEN_FILE}"

          # The attributes output has to be the same JSON as the file
          checks=$((checks + 1))
          jq -e --argjson output "${DETECTED_ATTRIBUTES}" '. == $output' "${DETECTED_FILE}" > /dev/null \
            || record "${DETECTED_FILE}" "attributes output" "same JSON as the file" "different"

          # 1. detected from the runner
          check        "${DETECTED_FILE}" os              "${EXPECTED_OS}"
          check_prefix "${DETECTED_FILE}" os-version      "${EXPECTED_OS_VERSION}"
          check        "${DETECTED_FILE}" platform        "${EXPECTED_PLATFORM}"
          check        "${DETECTED_FILE}" architecture    "${EXPECTED_ARCHITECTURE}"
          check        "${DETECTED_FILE}" podman-provider "${EXPECTED_PROVIDER}"
          check        "${DETECTED_FILE}" podman-version  "6.0.2"
          check        "${DETECTED_FILE}" repository      "podman-desktop"

          # 2. the provisioned VM, none of it comes from the ${RUNNER_LABEL} runner
          check "${PROVISIONED_FILE}" os              "windows"
          check "${PROVISIONED_FILE}" os-version      "2025"
          check "${PROVISIONED_FILE}" architecture    "x86_64"
          check "${PROVISIONED_FILE}" platform        "windows-nt"
          check "${PROVISIONED_FILE}" podman-provider "hyperv"
          check "${PROVISIONED_FILE}" podman-release  "6.0.2"
          # a key from extra-attributes overrides the generated one, the plain
          # podman-version passthrough is asserted on the detected file above
          check "${PROVISIONED_FILE}" podman-version  "7.0.0-rc1"

          # 3. inputs beat detection, architecture is the only one left to detect
          check "${OVERRIDDEN_FILE}" os           "fedora"
          check "${OVERRIDDEN_FILE}" os-version   "42"
          check "${OVERRIDDEN_FILE}" platform     "linux"
          check "${OVERRIDDEN_FILE}" repository   "podman-desktop-companion"
          check "${OVERRIDDEN_FILE}" architecture "${EXPECTED_ARCHITECTURE}"

          {
            echo "## ${RUNNER_LABEL}"
            echo
            if [ -z "${rows}" ]; then
              echo "All ${checks} attribute checks passed."
            else
              echo "| file | attribute | expected | actual |"
              echo "| --- | --- | --- | --- |"
              printf '%s' "${rows}"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

          exit "${fail}"

      # Same glob the e2e workflows use, it has to pick up both files that keep the
      # default name, no matter which folder they were written into. Without
      # if-no-files-found the upload would only warn and the job would stay green.
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: attributes-${{ matrix.runner }}
          if-no-files-found: error
          path: |
            **/workflow-run-attributes.json

  # The guarantee the runs-on-gh-runner input exists for: a call that would tag the
  # run with the wrong machine has to fail instead of quietly producing a file.
  # None of this depends on the runner, one is enough.
  validation:
    name: input validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Every call below leaves out exactly one thing, everything else is valid.
      # Without podman-version the later calls would be rejected for that reason
      # instead of the one they are meant to cover.
      - name: Reject a missing runs-on-gh-runner
        id: missing-mode
        continue-on-error: true
        uses: ./.github/actions/generate-test-attributes
        with:
          podman-version: 6.0.2
          filename: should-not-exist.json

      - name: Reject an invalid runs-on-gh-runner
        id: invalid-mode
        continue-on-error: true
        uses: ./.github/actions/generate-test-attributes
        with:
          runs-on-gh-runner: 'yes'
          podman-version: 6.0.2
          filename: should-not-exist.json

      - name: Reject a missing podman-version
        id: missing-version
        continue-on-error: true
        uses: ./.github/actions/generate-test-attributes
        with:
          runs-on-gh-runner: true
          filename: should-not-exist.json

      - name: Reject a provisioned run without any attribute
        id: no-attributes
        continue-on-error: true
        uses: ./.github/actions/generate-test-attributes
        with:
          runs-on-gh-runner: false
          podman-version: 6.0.2
          filename: should-not-exist.json

      - name: Reject a provisioned run with only some attributes
        id: partial-attributes
        continue-on-error: true
        uses: ./.github/actions/generate-test-attributes
        with:
          runs-on-gh-runner: false
          podman-version: 6.0.2
          os: windows
          filename: should-not-exist.json

      - name: Reject extra-attributes that is not a JSON object
        id: invalid-extra
        continue-on-error: true
        uses: ./.github/actions/generate-test-attributes
        with:
          runs-on-gh-runner: true
          podman-version: 6.0.2
          extra-attributes: 'not json'
          filename: should-not-exist.json

      # An unrecognised provider is a warning, not an error. A new provider must
      # not break the callers just because this action has not heard of it yet.
      - name: Accept an unrecognised podman-provider
        id: unknown-provider
        continue-on-error: true
        uses: ./.github/actions/generate-test-attributes
        with:
          runs-on-gh-runner: true
          podman-version: 6.0.2
          podman-provider: hyper-v
          filename: unknown-provider.json

      - name: Verify how the invalid calls were handled
        shell: bash
        env:
          MISSING_MODE: ${{ steps.missing-mode.outcome }}
          INVALID_MODE: ${{ steps.invalid-mode.outcome }}
          MISSING_VERSION: ${{ steps.missing-version.outcome }}
          NO_ATTRIBUTES: ${{ steps.no-attributes.outcome }}
          PARTIAL_ATTRIBUTES: ${{ steps.partial-attributes.outcome }}
          INVALID_EXTRA: ${{ steps.invalid-extra.outcome }}
          UNKNOWN_PROVIDER: ${{ steps.unknown-provider.outcome }}
        run: |
          # The steps above fail on purpose, so the run collects their error
          # annotations even when everything is correct. This table is the place
          # to look, it is red only when a call that should have been rejected
          # was accepted.
          set -uo pipefail
          fail=0

          {
            echo "## Input validation"
            echo
            echo "| call | handled as expected |"
            echo "| --- | --- |"
          } >> "${GITHUB_STEP_SUMMARY}"

          for pair in \
            "runs-on-gh-runner omitted:${MISSING_MODE}" \
            "runs-on-gh-runner set to 'yes':${INVALID_MODE}" \
            "podman-version omitted:${MISSING_VERSION}" \
            "a provisioned run without any attribute:${NO_ATTRIBUTES}" \
            "a provisioned run with only os:${PARTIAL_ATTRIBUTES}" \
            "extra-attributes that is not JSON:${INVALID_EXTRA}"; do
            name="${pair%:*}"
            outcome="${pair##*:}"
            if [ "${outcome}" = "failure" ]; then
              echo "| ${name} | yes |" >> "${GITHUB_STEP_SUMMARY}"
            else
              echo "| ${name} | **NO, it was accepted** |" >> "${GITHUB_STEP_SUMMARY}"
              echo "::error::The action accepted ${name} (outcome '${outcome}')"
              fail=1
            fi
          done

          # A rejected call must not leave a file behind either
          if [ -f should-not-exist.json ]; then
            echo "| no file written by a rejected call | **NO, the file exists** |" >> "${GITHUB_STEP_SUMMARY}"
            echo "::error::A rejected call still wrote should-not-exist.json"
            fail=1
          else
            echo "| no file written by a rejected call | yes |" >> "${GITHUB_STEP_SUMMARY}"
          fi

          # The unrecognised provider is the one call here that has to succeed, and
          # the value has to reach the file untouched. The warning itself is not
          # asserted, a later step cannot read the log of an earlier one.
          if [ "${UNKNOWN_PROVIDER}" != "success" ]; then
            echo "| unrecognised podman-provider accepted with a warning | **NO, it was rejected** |" >> "${GITHUB_STEP_SUMMARY}"
            echo "::error::An unrecognised podman-provider was rejected, it is supposed to be a warning"
            fail=1
          elif [ "$(jq -r '."podman-provider" // ""' unknown-provider.json)" != "hyper-v" ]; then
            echo "| unrecognised podman-provider written through | **NO, the value was changed** |" >> "${GITHUB_STEP_SUMMARY}"
            echo "::error::unknown-provider.json does not carry the provider that was passed in"
            fail=1
          else
            echo "| unrecognised podman-provider accepted with a warning | yes |" >> "${GITHUB_STEP_SUMMARY}"
          fi

          exit "${fail}"
